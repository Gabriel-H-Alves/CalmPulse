name: Security Scan & Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests & Security Tests
        run: ./gradlew test --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify No Secrets in Tracked Code
        run: |
          echo "Verificando se arquivos .jks ou .env foram comitados indevidamente..."
          ! git ls-files | grep -E '\.(jks|keystore|env|pfx)$'
